server:
  port: ${PORT:29502}

spring:
  datasource:
    # 本地开发默认使用文件型 H2（刷新/重启后排班记录仍在）；
    # Docker 部署时由环境变量 SPRING_DATASOURCE_URL 覆盖为 PostgreSQL。
    url: "${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/scheduling;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}"
    driver-class-name: "${SPRING_DATASOURCE_DRIVER:org.h2.Driver}"
    username: "${DB_USER:sa}"
    password: "${DB_PASSWORD:}"
  jpa:
    open-in-view: false
